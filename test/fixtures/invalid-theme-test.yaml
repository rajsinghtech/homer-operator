---
# Test dashboard with a custom theme (upstream Homer permits community themes)
apiVersion: homer.rajsingh.info/v1alpha1
kind: Dashboard
metadata:
  name: dashboard-custom-theme
  namespace: homer-test
spec:
  replicas: 1
  homerConfig:
    title: "Custom Theme Dashboard"
    subtitle: "This should pass validation"
    header: true  # Required field
    theme: "community-theme"  # Custom/community themes are valid upstream
    services:
      - parameters:
          name: "Test Services"
        items:
          - parameters:
              name: "Test Service"
              url: "https://example.com"
