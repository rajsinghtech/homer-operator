name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  # Release tags must be protected/immutable in repository settings for
  # race-free publication. These checks narrow the race for mutable refs, but
  # a workflow cannot atomically read a tag and publish all of its artifacts.
  # Cancel the older run for a ref, and let the explicit checks reject runs
  # that survive cancellation with a stale commit.
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26.5'
  # setup-envtest became a separately versioned module after controller-runtime
  # v0.21.0; v0.24.1 is the current supported tool release.
  ENVTEST_TOOL_VERSION: 'v0.24.1'
  ENVTEST_K8S_VERSION: '1.29.0'

jobs:
  verify-release:
    name: Verify versioned release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag target and semantic version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if ! git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null; then
            echo "Release tag ${GITHUB_REF_NAME} no longer exists on origin" >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} points to ${tag_sha}, expected ${EXPECTED_SHA}" >&2
            exit 1
          fi

          expected_version="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/homer-operator/Chart.yaml)"
          chart_app_version="$(awk '$1 == "appVersion:" { gsub(/^"|"$/, "", $2); print $2; exit }' charts/homer-operator/Chart.yaml)"
          if [[ "$chart_version" != "$expected_version" || "$chart_app_version" != "$expected_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Chart.yaml version (${chart_version}) and appVersion (${chart_app_version})" >&2
            exit 1
          fi
          echo "Verified ${GITHUB_REF_NAME} at ${EXPECTED_SHA} with chart version ${expected_version}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Install verification tools
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=0.6.7
          ACTIONLINT_VERSION=1.7.7
          kubeconform_archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          actionlint_archive="$RUNNER_TEMP/actionlint-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o "$kubeconform_archive"
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  '"$kubeconform_archive" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$kubeconform_archive" kubeconform
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$actionlint_archive"
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  '"$actionlint_archive" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$actionlint_archive" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify generation, code, and installers
        run: |
          set -euo pipefail
          make manifests
          git diff --exit-code
          make generate
          git diff --exit-code
          make lint
          go vet ./...
          make envtest ENVTEST_VERSION="$ENVTEST_TOOL_VERSION"
          envtest_assets="$(./bin/setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$PWD/bin" -p path)"
          mapfile -t go_packages < <(go list ./... | grep -v '/e2e$')
          KUBEBUILDER_ASSETS="$envtest_assets" go test "${go_packages[@]}"
          go build ./...
          make build-installer IMG=ghcr.io/rajsinghtech/homer-operator:main
          git diff --exit-code
          ./scripts/check-manifest-generation.sh ./bin/kustomize
          ./scripts/check-installer-sync.sh ./bin/kustomize

          release_version="${GITHUB_REF_NAME#v}"
          installer_path="$RUNNER_TEMP/homer-operator-${release_version}-install.yaml"
          main_image="${REGISTRY}/${IMAGE_NAME}:main"
          release_image="${REGISTRY}/${IMAGE_NAME}:${release_version}"
          main_image_count="$(grep -Fc "image: ${main_image}" dist/install.yaml)"
          if [[ "$main_image_count" -ne 1 ]]; then
            echo "Expected exactly one tracked main image in dist/install.yaml; found ${main_image_count}" >&2
            exit 1
          fi
          sed "s|image: ${main_image}|image: ${release_image}|g" dist/install.yaml > "$installer_path"
          if ! grep -Fq "image: ${release_image}" "$installer_path" || grep -Fq "image: ${main_image}" "$installer_path"; then
            echo "Version-specific installer does not contain the release image" >&2
            exit 1
          fi
          kubeconform -strict -ignore-missing-schemas -summary "$installer_path"
          echo "Created version-specific installer: ${installer_path}"

      - name: Verify Helm, workflows, and packaging surfaces
        run: |
          set -euo pipefail
          helm lint charts/homer-operator -f charts/homer-operator/ci/values.yaml
          ./scripts/chart_packaging_test.sh
          ./scripts/metrics_surface_test.sh
          ./scripts/release_surface_test.sh
          ./scripts/sync-crd-to-helm_test.sh
          shellcheck scripts/*.sh
          actionlint
          git diff --check

  verify-release-e2e:
    name: Verify versioned release on isolated kind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    env:
      NAMESPACE: homer-operator-system
      DASHBOARD_NAMESPACE: public
      E2E_OPERATOR_NAMESPACE: homer-operator-system
      E2E_OPERATOR_DEPLOYMENT: homer-operator
      IMG: homer-operator:release-e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject stale release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create isolated kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: homer-operator-release

      - name: Load image into kind
        run: kind load docker-image "${IMG}" --name homer-operator-release

      - name: Install chart
        run: |
          helm install homer-operator charts/homer-operator \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set image.repository=homer-operator \
            --set image.tag=release-e2e \
            --set image.pullPolicy=Never \
            --wait --timeout 120s

      - name: Wait for operator rollout
        run: kubectl rollout status deployment/homer-operator -n "${NAMESPACE}" --timeout=120s

      - name: Deploy sample Dashboard
        run: |
          kubectl create namespace "${DASHBOARD_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f config/samples/homer_v1alpha1_dashboard.yaml

      - name: Wait for Dashboard rollout
        run: kubectl wait --for=condition=Available deployment/dashboard-sample-homer -n "${DASHBOARD_NAMESPACE}" --timeout=180s

      - name: Verify sample page configuration
        run: kubectl get configmap dashboard-sample-homer -n "${DASHBOARD_NAMESPACE}" -o jsonpath='{.data.status\.yml}' | grep -F 'A second Homer page'

      - name: Run black-box E2E suite
        run: go test ./test/e2e -v -ginkgo.v

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pods -n "${NAMESPACE}" || true
          kubectl describe pods -n "${DASHBOARD_NAMESPACE}" || true
          kubectl logs -n "${NAMESPACE}" -l app.kubernetes.io/name=homer-operator --all-containers --tail=-1 || true
          kubectl logs -n "${DASHBOARD_NAMESPACE}" -l dashboard.homer.rajsingh.info/name=dashboard-sample --all-containers --tail=-1 || true

  build-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [verify-release, verify-release-e2e]
    if: ${{ needs.verify-release.result == 'success' && needs.verify-release-e2e.result == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject stale release tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish a chart for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Extract release version
        id: version
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Final tag consistency check before image publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Repository tag protection/immutability is still required for a
          # race-free release; this is the last observable check before push.
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish image for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify build success
        run: |
          if [[ -z "${{ steps.build.outputs.digest }}" ]]; then
            echo "❌ Docker build failed - no digest generated"
            exit 1
          fi
          echo "✅ Docker build successful"
          echo "Digest: ${{ steps.build.outputs.digest }}"

      - name: Install kubeconform for installer validation
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=0.6.7
          kubeconform_archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o "$kubeconform_archive"
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  '"$kubeconform_archive" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$kubeconform_archive" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Final tag consistency check before provenance publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish provenance for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Attest container provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify container provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --bundle-from-oci

      - name: Prepare digest-pinned installer
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          main_image="${REGISTRY}/${IMAGE_NAME}:main"
          release_image="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          installer_path="$RUNNER_TEMP/homer-operator-${VERSION}-install.yaml"
          main_image_count="$(grep -Fc "image: ${main_image}" dist/install.yaml)"
          if [[ "$main_image_count" -ne 1 ]]; then
            echo "Expected exactly one tracked main image in dist/install.yaml; found ${main_image_count}" >&2
            exit 1
          fi
          sed "s|image: ${main_image}|image: ${release_image}|g" dist/install.yaml > "$installer_path"
          if ! grep -Fq "image: ${release_image}" "$installer_path" || grep -Fq "image: ${main_image}" "$installer_path"; then
            echo "Digest-pinned installer does not contain the release image" >&2
            exit 1
          fi
          kubeconform -strict -ignore-missing-schemas -summary "$installer_path"
          echo "Created digest-pinned installer: ${installer_path}"

      # Repository tag protection/immutability is required for race-free
      # publication; this check is immediately before artifact handoff.
      - name: Final tag consistency check before installer publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish installer for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Upload version-specific installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.ref_name }}
          path: ${{ runner.temp }}/homer-operator-${{ steps.version.outputs.version }}-install.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Final tag consistency check before signature publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish signatures for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Sign container image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              echo "Signing: $tag@${DIGEST}"
              cosign sign --yes "$tag@${DIGEST}"
            fi
          done <<< "$TAGS"

      - name: Verify container signatures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$"
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              echo "Verifying: $tag@${DIGEST}"
              cosign verify \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp "$identity" \
                "$tag@${DIGEST}" >/dev/null
            fi
          done <<< "$TAGS"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          test -s sbom.spdx.json
          jq -e --arg image "$IMAGE_REF" --arg digest "$DIGEST" '
            (.spdxVersion | type == "string" and startswith("SPDX-")) and
            (.SPDXID == "SPDXRef-DOCUMENT") and
            (.packages | type == "array") and
            any(.packages[]?;
              ((.name // "") == $image) and
              ((.versionInfo // "") == $digest) and
              ((.primaryPackagePurpose // "") == "CONTAINER"))
          ' sbom.spdx.json >/dev/null
          echo "Validated SPDX JSON SBOM for ${IMAGE_REF}@${DIGEST}"

      # Repository tag protection/immutability is required for race-free
      # publication; this check is immediately before artifact handoff.
      - name: Final tag consistency check before SBOM publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish SBOM for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  release-helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [build-image, verify-release]
    # Development chart publication is handled by helm-release.yml. This job
    # must only publish the chart that belongs to a versioned release tag.
    if: ${{ needs.build-image.result == 'success' && needs.verify-release.result == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      chart_digest: ${{ steps.publish-chart.outputs.chart_digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject stale release tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to create a release for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Chart with image digest
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
          VERSION: ${{ needs.build-image.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "$DIGEST" || ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid or missing image digest: $DIGEST" >&2
            exit 1
          fi

          # Update Chart.yaml versions
          sed -i "s/version: .*/version: $VERSION/" charts/homer-operator/Chart.yaml
          sed -i "s/appVersion: .*/appVersion: \"$VERSION\"/" charts/homer-operator/Chart.yaml

          # Update values.yaml to use the specific digest
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Update the main image repository and immutable digest. The digest
          # takes precedence over tag in the chart helper.
          sed -i "s|^  repository: .*|  repository: ${{ env.REGISTRY }}/${REPO_NAME}|" charts/homer-operator/values.yaml
          sed -i "s|^  digest: .*|  digest: \"$DIGEST\"|" charts/homer-operator/values.yaml

          echo "Updated Chart.yaml and values.yaml"
          echo "Version: $VERSION"
          echo "Image: ${{ env.REGISTRY }}/${REPO_NAME}@${DIGEST}"

      - name: Validate updated chart
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          EXPECTED_IMAGE="${{ env.REGISTRY }}/${REPO_NAME}@${{ needs.build-image.outputs.digest }}"
          helm lint charts/homer-operator
          helm template test charts/homer-operator --dry-run --set crd.create=true > rendered-chart.yaml
          grep -F "image: $EXPECTED_IMAGE" rendered-chart.yaml
          echo "✅ Updated chart validation passed"

      - name: Package Helm Chart
        id: package-chart
        run: |
          VERSION="${{ needs.build-image.outputs.version }}"
          helm package charts/homer-operator --destination ./packaged-charts
          test -s "./packaged-charts/homer-operator-${VERSION}.tgz"

      - name: Final tag consistency check before chart publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Repository tag protection/immutability is still required for a
          # race-free release; this is the last observable check before push.
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish chart for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Push and verify Helm Chart
        id: publish-chart
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-image.outputs.version }}"
          REPO_NAME="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          local_chart="./packaged-charts/homer-operator-${VERSION}.tgz"

          push_output="$(helm push "$local_chart" "oci://${{ env.REGISTRY }}/${REPO_NAME}/charts" 2>&1)"
          printf '%s\n' "$push_output"
          chart_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$push_output")"
          if [[ ! "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Helm push did not return a valid OCI digest: ${chart_digest}" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/chart-verification"
          helm pull "oci://${{ env.REGISTRY }}/${REPO_NAME}/charts/homer-operator" \
            --version "$VERSION" \
            --destination "$RUNNER_TEMP/chart-verification"
          pulled_chart="$RUNNER_TEMP/chart-verification/homer-operator-${VERSION}.tgz"
          test -s "$pulled_chart"
          cmp --silent "$local_chart" "$pulled_chart"
          echo "chart_digest=${chart_digest}" >> "$GITHUB_OUTPUT"

          echo "✅ Chart pushed and byte-verified: oci://${{ env.REGISTRY }}/${REPO_NAME}/charts/homer-operator:${VERSION} (${chart_digest})"

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-image, release-helm]
    if: ${{ needs.build-image.result == 'success' && needs.release-helm.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject stale release tag before creating release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to create a release for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Download version-specific installer
        uses: actions/download-artifact@v4
        with:
          name: installer-${{ github.ref_name }}

      - name: Final tag consistency check before GitHub publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Repository tag protection/immutability is still required for a
          # race-free release; this is the last observable check before the
          # GitHub Release is created or updated.
          git ls-remote --exit-code --refs origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to create a release for stale tag ${GITHUB_REF_NAME}: ${tag_sha} != ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            sbom.spdx.json
            homer-operator-${{ needs.build-image.outputs.version }}-install.yaml
          body: |
            ## Release ${{ needs.build-image.outputs.version }}

            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-image.outputs.digest }}
            ```

            **Digest:** `${{ needs.build-image.outputs.digest }}`

            **OCI chart digest:** `${{ needs.release-helm.outputs.chart_digest }}`

            ### Helm Chart
            ```bash
            helm install homer-operator oci://${{ env.REGISTRY }}/${{ github.repository }}/charts/homer-operator@${{ needs.release-helm.outputs.chart_digest }} \
              --namespace homer-operator-system \
              --create-namespace
            ```

            The chart digest above is for version `${{ needs.build-image.outputs.version }}`; use the digest-pinned reference for reproducible installs.

            ### Kubernetes Installer
            The release asset `homer-operator-${{ needs.build-image.outputs.version }}-install.yaml` is pinned to this release's operator image. The tracked `dist/install.yaml` and `deploy/operator.yaml` manifests remain development manifests that use `:main`.

            ### Supply-chain artifacts
            The attached `sbom.spdx.json` is validated SPDX JSON tied to the published image digest. The image also has keyless cosign signatures and a verified SLSA provenance attestation.

            ### Highlights

            #### Upstream Homer configuration parity ([#104](https://github.com/rajsinghtech/homer-operator/pull/104))

            - Align the Dashboard API and generated CRD with upstream Homer: root title, subtitle, document title, logo, icon, header, footer, columns, connectivity checks, hotkeys, themes, stylesheets, colors, defaults, proxy, messages, external config, refresh interval, links, services, and pages.
            - Model direct service and item fields, including logos/icons, subtitles, tags, keywords, URLs, targets, tag styles, types, backgrounds, classes, endpoints, update intervals, success codes, credentials, headers, quick links, and smart-card parameters.
            - Preserve unknown and future Homer fields, explicit empty arrays/objects, nulls, false values, zero refresh values, footer boolean forms, open-ended nested objects, and nil array entries across CRD and YAML/JSON round trips; include handwritten deep-copy support for those open-ended values.
            - Retain legacy `parameters`, annotation, `headers`, and `customHeaders` inputs while emitting upstream `item.headers` objects with deterministic precedence and case-insensitive header-name handling.
            - Resolve API-key, token, username, password, and custom-header Secrets safely; propagate configured header Secrets to discovered Ingress, HTTPRoute, Service, and generic items with Secret values authoritative over direct and discovery headers.

            #### Pages, assets, and deployment behavior ([#104](https://github.com/rajsinghtech/homer-operator/pull/104), [#105](https://github.com/rajsinghtech/homer-operator/pull/105))

            - Add named Homer page configuration with generated `<page>.yml` ConfigMap data and page-aware deployment asset mounts.
            - Add external Homer configuration and text/binary asset support, nested asset staging, icon aliases, PWA icon paths, generated `manifest.json`, cross-namespace asset references and mirrors, replacement/stale-mirror cleanup, and referenced ConfigMap watches.
            - Add configurable config-sync image settings, DNS/resource/deployment handling, stronger deployment diff detection, server-assigned Service-field preservation, and dashboard-owned configuration preservation during updates.
            - Add living sample documentation and a black-box Kubernetes E2E suite covering operator health, Dashboard creation and updates, ConfigMap watches, cleanup, pages/assets, and Ingress discovery.

            ### Fixes and hardening

            - Persist Dashboard status through the CRD status subresource, propagate update errors, and retry transient remote-cluster failures and kubeconfig Secret rotation.
            - Reconcile newly created Dashboards reliably after adding their finalizer while continuing to suppress status-only reconcile loops.
            - Preserve Kubernetes resource versions and server-assigned Service fields, including ClusterIP/IP families, NodePorts, and existing Service fields during reconciliation.
            - Apply per-cluster selectors and domain filters correctly, keep local and remote filtering distinct, enrich discovered resources with cluster metadata, and make multi-cluster aggregation deterministic.
            - Keep same-named resources from different clusters, namespaces, or resource kinds independent; qualify Ingress and HTTPRoute source keys, clean up the correct source, and allow a CRD item to enhance only its intended discovered resource.
            - Watch configuration and asset references, deduplicate reconciliation requests, and keep generated assets and PWA paths synchronized after updates or removals.
            - Resolve HTTPRoute protocols only from eligible Gateway listeners, honor parent-reference ports, explicit Gateway/Listener/GatewayClass status, `allowedRoutes` namespace/kind policy, Gateway API wildcard suffix matching (including deeper subdomains but not the apex), and controller-specific parent status; watch GatewayClass transitions and preserve resolved remote HTTPS protocols during local dashboard rebuilds.
            - Emit Homer-compatible `item.headers` objects for direct configuration, annotations, health checks, and Secret-backed authentication; normalize legacy `headers`/`customHeaders` forms with deterministic, case-insensitive precedence and propagate configured header Secrets to discovered generic items.
            - Keep local and remote resource provenance authoritative in memory, prevent spoofed remote annotations from changing local HTTPRoute resolution, preserve source-cluster namespace defaults, and prevent local namespace defaults from leaking onto remote Ingress, HTTPRoute, or Service resources.
            - Treat `homerConfig.externalConfig` as authoritative: skip ignored inline validation, discovery, and inline Secret injection while keeping external ConfigMap mode synchronized and safe.
            - Retain last-good remote discovery results only for the same cluster identity and discovery configuration; invalidate them on selector, label, namespace, Secret, or disabled-state changes, fail closed on transient discovery/protocol read failures, and treat missing remote APIs as authoritative empty results.
            - Propagate remote discovery, Gateway-selector, and Gateway protocol read failures instead of silently dropping or downgrading routes, persist connection errors and last-known resource counts in Dashboard status, and retain the last successful connection time across disconnects.
            - Remove obsolete kube-rbac-proxy resources, secure metrics with the required RBAC, gate metrics resources consistently, and publish release charts with immutable image digests.
            - Validate the generated SPDX SBOM against Syft's container package name, purpose, and exact published image digest before attaching it to the GitHub Release.
            - Generate a status-enabled CRD, prevent duplicate CRDs in installer manifests, and verify Kustomize, Helm, generated manifests, metrics, CRD synchronization, image signatures, and the published chart in CI.
            - Publish and verify a signed SLSA container provenance attestation alongside the image.
            - Correct Helm uninstall and installation documentation, validate release tags as `vMAJOR.MINOR.PATCH`, and remove obsolete tag-handling paths from the development chart workflow.
            - Reduce release image-job permissions to read-only repository contents while retaining only the package, identity, and attestation permissions needed to publish and verify artifacts.

            ### Resolved issues and project status

            - Resolves [#14](https://github.com/rajsinghtech/homer-operator/issues/14) (Homer Pages), [#43](https://github.com/rajsinghtech/homer-operator/issues/43) (black-box E2E coverage and living documentation), and [#95](https://github.com/rajsinghtech/homer-operator/issues/95) (configurable config-sync image).
            - [#10](https://github.com/rajsinghtech/homer-operator/issues/10) remains intentionally open: it is Renovate's Dependency Dashboard, not an unresolved product defect.

            GitHub-generated release notes are appended below this release description.
