name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

env:
  GO_VERSION: '1.26.3'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run linters
        run: make lint

      - name: Verify manifests
        run: |
          make manifests
          git diff --exit-code

      - name: Verify code generation
        run: |
          make generate
          git diff --exit-code

      - name: Run unit tests with coverage
        run: |
          make test
          go tool cover -html=cover.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: homer-operator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-test:
    name: Helm Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Validate Helm chart
        run: |
          helm lint charts/homer-operator
          helm template test charts/homer-operator --dry-run > /dev/null
          echo "Helm chart validation passed"

  helm-e2e:
    # helm lint/template never pull the images they reference, so a broken
    # image reference in values.yaml (as happened with the kube-rbac-proxy
    # sidecar after its registry was sunset) passes CI silently and only
    # surfaces when a real user runs `helm install`. This job closes that
    # gap by actually installing the chart on a kind cluster and waiting for
    # the operator and a sample Dashboard's pods to become Ready.
    name: Helm E2E (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAMESPACE: homer-operator-system
      DASHBOARD_NAMESPACE: public
      IMG: homer-operator:e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: homer-operator-ci

      - name: Load image into kind
        run: kind load docker-image ${{ env.IMG }} --name homer-operator-ci

      - name: Install chart (CRDs + operator)
        run: |
          helm install homer-operator charts/homer-operator \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.repository=homer-operator \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --wait --timeout 120s

      - name: Wait for operator rollout
        run: |
          kubectl rollout status deployment/homer-operator \
            -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Deploy sample Dashboard
        run: |
          kubectl create namespace ${{ env.DASHBOARD_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          cat <<'EOF' | kubectl apply -f -
          apiVersion: homer.rajsingh.info/v1alpha1
          kind: Dashboard
          metadata:
            name: ci-dashboard
            namespace: public
          spec:
            replicas: 1
            homerConfig:
              title: "CI Dashboard"
              header: true
          EOF

      - name: Wait for Dashboard rollout
        run: |
          kubectl wait --for=condition=Available deployment/ci-dashboard-homer \
            -n ${{ env.DASHBOARD_NAMESPACE }} --timeout=120s

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pods -n ${{ env.NAMESPACE }} || true
          kubectl describe pods -n ${{ env.DASHBOARD_NAMESPACE }} || true
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=homer-operator --tail=-1 || true
          kubectl logs -n ${{ env.DASHBOARD_NAMESPACE }} -l dashboard.homer.rajsingh.info/name=ci-dashboard --all-containers --tail=-1 || true

