apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homer-operator.managerName" . }}
  namespace: {{ include "homer-operator.namespace" . }}
  labels:
    {{- include "homer-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
    {{- if eq .Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.deploymentStrategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.deploymentStrategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "homer-operator.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "homer-operator.labels" . | nindent 8 }}
        control-plane: controller-manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homer-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - name: manager
        image: {{ include "homer-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        {{- if .Values.operator.leaderElection.enabled }}
        - --leader-elect
        {{- end }}
        {{- if .Values.operator.metrics.enabled }}
        - --metrics-bind-address={{ .Values.operator.metrics.bindAddress }}
        {{- if .Values.operator.metrics.secureMetrics }}
        - --metrics-secure
        {{- end }}
        {{- else }}
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address={{ .Values.operator.healthProbe.bindAddress }}
        {{- if .Values.operator.enableGatewayAPI }}
        - --enable-gateway-api
        {{- end }}
        - --homer-image={{ include "homer-operator.homerImage" . }}
        - --config-sync-image={{ .Values.homer.configSyncImage }}
        {{- $envVars := include "homer-operator.env" . }}
        {{- if $envVars }}
        env:
        {{- $envVars | nindent 8 }}
        {{- end }}
        {{- $envFromVars := include "homer-operator.envFrom" . }}
        {{- if $envFromVars }}
        envFrom:
        {{- $envFromVars | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.operator.healthProbe.bindAddress | replace ":" "" | int }}
          name: health
          protocol: TCP
        {{- if .Values.operator.metrics.enabled }}
        - containerPort: {{ .Values.operator.metrics.bindAddress | replace ":" "" | int }}
          name: https
          protocol: TCP
        {{- end }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- if .Values.startupProbe.enabled }}
        {{- $startupProbe := omit .Values.startupProbe "enabled" "httpGet" "exec" "tcpSocket" "grpc" }}
        {{- if .Values.startupProbe.exec }}
        {{- $_ := set $startupProbe "exec" .Values.startupProbe.exec }}
        {{- else if .Values.startupProbe.grpc }}
        {{- $_ := set $startupProbe "grpc" .Values.startupProbe.grpc }}
        {{- else if .Values.startupProbe.tcpSocket }}
        {{- $_ := set $startupProbe "tcpSocket" .Values.startupProbe.tcpSocket }}
        {{- else if .Values.startupProbe.httpGet }}
        {{- $_ := set $startupProbe "httpGet" .Values.startupProbe.httpGet }}
        {{- else }}
        {{- fail "startupProbe requires one of httpGet, exec, grpc, or tcpSocket" }}
        {{- end }}
        startupProbe:
          {{- toYaml $startupProbe | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
